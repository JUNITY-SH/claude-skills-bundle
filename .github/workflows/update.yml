name: Mise à jour des skills

on:
  schedule:
    - cron: "0 5 * * 1" # chaque lundi à 5h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.txt, build.sh]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - name: Commit si changement
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Mise à jour des skills ($(date -u +%Y-%m-%d))"
          git push
